{% extends "base.html" %} {% block title %}Companies | Ainstien{% endblock %} {%
block page_css %}
<link
  rel="stylesheet"
  href="{{ url_for('static', filename='css/companies.css') }}"
/>
{% endblock %} {% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h2 class="fw-bold text-dark m-0">Companies loaded in Database</h2>
    </div>
    <div id="statusIndicator" class="badge status-fetching px-3 py-2">
      Fetching data...
    </div>
  </div>

  <div class="card border-0 shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead>
          <tr>
            <th>Ticker</th>
            <th>Name</th>
            <th class="text-end">Revenue [MSEK]</th>
            <th class="text-end">EBIT [MSEK]</th>
            <th class="text-end">Action</th>
          </tr>
        </thead>
        <tbody id="companyTableBody" class="financial-data"></tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %} {% block scripts %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/companies.js') }}"></script>
{% endblock %}
